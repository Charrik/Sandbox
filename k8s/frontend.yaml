apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sandbox-frontend
  template:
    metadata:
      labels:
        app: sandbox-frontend
    spec:
      containers:
        - name: frontend
          image: "ghcr.io/charrik/sandbox-frontend:20261113-082245"
          ports:
            - containerPort: 8888
---
apiVersion: v1
kind: Service
metadata:
  name: sandbox-frontend
spec:
  type: NodePort
  selector:
    app: sandbox-frontend
  ports:
    - port: 8888
      targetPort: 8888
      nodePort: 30080