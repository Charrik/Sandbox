name: CD Pipeline (Kubernetes)

on:
  workflow_dispatch:
    inputs:
      VERSION:
        description: "Версия образа (например, 20261113-082245)"
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          cat << 'EOF' > ~/.kube/config
          ${{ secrets.KUBE_CONFIG }}
          EOF
          chmod 600 ~/.kube/config

      - name: Deploy with Helm
        run: |
          helm upgrade --install sandbox ./helm/sandbox \
            --set image.tag=${{ github.event.inputs.VERSION }} \
            --wait --timeout 5m