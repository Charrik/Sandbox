stages:
  - build

variables:
  VERSION: "1.0.$CI_PIPELINE_ID"

build-frontend-pwsh:
  stage: build
  tags:
    - windows
    - powershell
  script:
    - Write-Host "Авторизация в GitLab Registry..."
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    
    - Write-Host "Сборка Docker-образа фронтенда..."
    - docker build --build-arg VERSION="$VERSION" -t "$CI_REGISTRY_IMAGE/momo-store-frontend:$CI_COMMIT_SHA" -t "$CI_REGISTRY_IMAGE/momo-store-frontend:latest" .
    
    - Write-Host "Публикация образов в реестр GitLab..."
    - docker push "$CI_REGISTRY_IMAGE/momo-store-frontend:$CI_COMMIT_SHA"
    - docker push "$CI_REGISTRY_IMAGE/momo-store-frontend:latest"
    
    - Write-Host "Публикация в Nexus..."
    - docker tag "$CI_REGISTRY_IMAGE/momo-store-frontend:latest" "93.77.166.24:8081/akhatov-frontend/momo-store-frontend:latest"
    - docker login -u "student" -p "1iRd|OjBGq9V" "93.77.166.24:8081"
    - docker push "93.77.166.24:8081/akhatov-frontend/momo-store-frontend:latest"