version: '3.8'

services:
  backend:
    image: sandbox-backend:latest
    container_name: sandbox-backend
    env_file:
      - .env
    ports:
      - "8081:8081"
    networks:
      - sandbox-network
    restart: unless-stopped

  frontend:
    image: sandbox-frontend:latest
    container_name: sandbox-frontend
    ports:
      - "8888:8888"
    depends_on:
      - backend
    networks:
      - sandbox-network
    restart: unless-stopped

networks:
  sandbox-network:
    driver: bridge